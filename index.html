<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dandiya Invitation</title>
  <!-- Confetti library for celebration effect -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
  <style>
    body {
      margin: 0;
      padding: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      /* Aapki photo background me aayegi */
      background: url('my-photo.jpg') no-repeat center center fixed;
      background-size: cover;
      font-family: Arial, sans-serif;
      text-align: center;
      overflow: hidden;
    }

    /* Dark Overlay taaki text acche se dikhe */
    body::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.4);
      z-index: 0;
    }

    .card {
      position: relative;
      z-index: 1;
      background: rgba(255, 255, 255, 0.92);
      padding: 30px;
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      border: 4px solid #ff0055;
      max-width: 85%;
    }

    .sticker {
      font-size: 45px;
      margin-bottom: 10px;
    }

    h1 {
      color: #d6004c;
      font-size: 22px;
      margin-bottom: 30px;
    }

    .btn-container {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 20px;
      min-height: 80px;
    }

    /* Bada YES Button */
    .yes-btn {
      padding: 18px 36px;
      font-size: 22px;
      font-weight: bold;
      color: white;
      background-color: #28a745;
      border: none;
      border-radius: 15px;
      cursor: pointer;
      box-shadow: 0 5px 15px rgba(40, 167, 69, 0.4);
      transition: transform 0.2s;
    }

    .yes-btn:active {
      transform: scale(0.95);
    }

    /* Chhota NO Button */
    .no-btn {
      padding: 5px 10px;
      font-size: 10px;
      color: white;
      background-color: #dc3545;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      position: absolute;
    }
  </style>
</head>
<body>

  <!-- Background Song (Online Garba Track) -->
  <audio id="dandiyaAudio" src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3"></audio>

  <div class="card">
    <div class="sticker">🪘 💃 🕺 🪘</div>
    <h1>Kaun mere sath dandiya khelna chahta hai?</h1>
    
    <div class="btn-container">
      <button class="yes-btn" onclick="celebrate()">YES! 💃</button>
      <button class="no-btn" id="noBtn" onmouseover="moveButton()" onclick="moveButton()">No</button>
    </div>
  </div>

  <script>
    function moveButton() {
      const btn = document.getElementById('noBtn');
      const x = Math.random() * (window.innerWidth - 80);
      const y = Math.random() * (window.innerHeight - 40);
      
      btn.style.position = 'fixed';
      btn.style.left = x + 'px';
      btn.style.top = y + 'px';
    }

    function celebrate() {
      // 1. Song play karein
      const audio = document.getElementById('dandiyaAudio');
      audio.play();

      // 2. Screen par phatake / confetti celebration effect
      confetti({
        particleCount: 150,
        spread: 80,
        origin: { y: 0.6 }
      });

      // 3. Sweet Alert Message
      setTimeout(() => {
        alert("Yay! Chalye dandiya khelte hain! 🎉💃🪘");
      }, 500);
    }
  </script>

</body>
</html>
