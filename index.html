<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dandiya Invitation</title>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
  <style>
    body {
      margin: 0;
      padding: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: url('https://raw.githubusercontent.com/Abhi08521/dandiya-invite/main/IMG_20250925_094246.jpg') no-repeat center center fixed;
      background-size: cover;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      text-align: center;
      overflow: hidden;
    }

    body::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.4);
      z-index: 0;
    }

    .card {
      position: relative;
      z-index: 1;
      background: rgba(255, 255, 255, 0.95);
      padding: 25px 20px;
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      border: 4px solid #ff0055;
      max-width: 85%;
      width: 320px;
    }

    .sticker {
      font-size: 40px;
      margin-bottom: 5px;
    }

    h1 {
      color: #d6004c;
      font-size: 20px;
      margin-bottom: 15px;
    }

    input[type="text"] {
      width: 85%;
      padding: 10px;
      margin-bottom: 15px;
      border: 2px solid #ff0055;
      border-radius: 8px;
      font-size: 16px;
      text-align: center;
      outline: none;
    }

    .btn-container {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 15px;
      min-height: 60px;
    }

    .yes-btn {
      padding: 14px 28px;
      font-size: 20px;
      font-weight: bold;
      color: white;
      background-color: #28a745;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      box-shadow: 0 5px 15px rgba(40, 167, 69, 0.4);
    }

    .no-btn {
      padding: 6px 12px;
      font-size: 12px;
      color: white;
      background-color: #dc3545;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      position: absolute;
    }
  </style>
</head>
<body>

  <!-- Working Dandiya / Chogada Audio Source -->
  <audio id="chogadaAudio" src="https://ia801503.us.archive.org/15/items/chogada-loveyatri/Chogada.mp3" preload="auto"></audio>

  <div class="card">
    <div class="sticker">🪘 💃 🕺 🪘</div>
    <h1>Kaun mere sath dandiya khelna chahta hai?</h1>
    
    <input type="text" id="visitorName" placeholder="Aapka Naam Ya Email..." required />

    <div class="btn-container">
      <button class="yes-btn" onclick="handleYes()">YES! 💃</button>
      <button class="no-btn" id="noBtn" onmouseover="moveButton()" onclick="moveButton()">No</button>
    </div>
  </div>

  <script>
    let noCount = 0;
    const formspreeEndpoint = "https://formspree.io/f/mjykkboo";

    function moveButton() {
      noCount++;
      const btn = document.getElementById('noBtn');
      const x = Math.random() * (window.innerWidth - 80);
      const y = Math.random() * (window.innerHeight - 40);
      
      btn.style.position = 'fixed';
      btn.style.left = x + 'px';
      btn.style.top = y + 'px';
    }

    function sendResponseToOwner(name, responseType) {
      fetch(formspreeEndpoint, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          Visitor_Info: name,
          Response: responseType,
          No_Clicked_Count: noCount,
          Time: new Date().toLocaleString()
        })
      }).catch(err => console.log("Tracking error:", err));
    }

    function handleYes() {
      const nameInput = document.getElementById('visitorName').value.trim();
      
      if (!nameInput) {
        alert("Pehle apna naam ya email likhein! 😊");
        return;
      }

      // Email tracker send karega
      sendResponseToOwner(nameInput, "YES");

      // Song Play karega (Bina kisi alert popup ke)
      const audio = document.getElementById('https://youtu.be/asYxxtiWUyw?si=ZbtuLx-qDAzpFB-x');
      audio.play().catch(e => console.log(:', e));

      // Celebration Confetti
      confetti({
        particleCount: 200,
        spread: 120,
        origin: { y: 0.6 }
      });
    }
  </script>

</body>
</html>
