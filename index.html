<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dandiya Invitation</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Arial', sans-serif;
        }

        body {
            /* YAHAN APNI PHOTO KA LINK DAALEIN */
            background-image: url('https://i.postimg.cc/9XxpxY23/IMG-20250925-094246.png'); 
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            overflow: hidden;
            position: relative;
        }

        /* Dark overlay taaki text clear dikhe */
        body::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1;
        }

        /* Dandiya Sticker Background */
        .sticker {
            position: absolute;
            font-size: 100px;
            opacity: 0.3;
            z-index: 1;
            animation: float 3s ease-in-out infinite;
        }
        .sticker.left { left: 10%; top: 20%; }
        .sticker.right { right: 10%; bottom: 20%; }

        @keyframes float {
            0% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(10deg); }
            100% { transform: translateY(0px) rotate(0deg); }
        }

        .content {
            z-index: 2;
            position: relative;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 30px; /* Buttons ke beech space */
        }

        h1 {
            color: #fff;
            font-size: 2.2rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px #000;
        }

        /* YES BUTTON - BAHUT BADA */
        #yes-btn {
            font-size: 3rem;
            padding: 20px 60px;
            background-color: #ff0044;
            color: white;
            border: 5px solid #fff;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
            transition: transform 0.2s;
        }

        #yes-btn:active {
            transform: scale(0.95);
        }

        /* NO BUTTON - THODA BADA AUR ALAG SE */
        #no-btn {
            font-size: 1.2rem; /* Size bada kar diya */
            padding: 10px 25px;
            background-color: #555;
            color: #fff;
            border: 2px solid #777;
            border-radius: 8px;
            cursor: pointer;
            position: relative; /* Shuru me normal position me rahega */
            z-index: 3;
            transition: all 0.3s ease;
        }

    </style>
</head>
<body>

    <!-- Dandiya Stickers -->
    <div class="sticker left">🥁</div>
    <div class="sticker right">💃</div>

    <div class="content">
        <h1>Kaun mere sath Dandiya khelna chahta hai?</h1>
        
        <div style="display: flex; flex-direction: column; align-items: center; gap: 20px;">
            <!-- Yes Button -->
            <button id="yes-btn">YES ✅</button>
            
            <!-- No Button (Shuru me Yes ke niche rahega) -->
            <button id="no-btn">No ❌</button>
        </div>
    </div>

    <!-- YAHAN APNE DANDIYA SONG KA MP3 LINK DAALEIN -->
    <audio id="dandiya-song" src="YOUR_SONG_LINK_HERE.mp3" loop></audio>

    <script>
        const noBtn = document.getElementById('no-btn');
        const yesBtn = document.getElementById('yes-btn');
        const song = document.getElementById('dandiya-song');

        // No button bhaagne ka logic
        function moveNoButton() {
            // Screen ke random position par bhejne ke liye 'fixed' position use karenge
            noBtn.style.position = 'fixed';
            
            // Random position generate karna (10% se 80% ke beech, taaki screen se bahar na jaye)
            const randomX = Math.floor(Math.random() * 70) + 10; 
            const randomY = Math.floor(Math.random() * 70) + 10;
            
            noBtn.style.left = randomX + 'vw'; // Viewport width ke hisaab se
            noBtn.style.top = randomY + 'vh';  // Viewport height ke hisaab se
            
            // Click karne par hat jaye aur unclickable ho jaye
            noBtn.style.pointerEvents = 'none';
            noBtn.style.opacity = '0.2'; // Halka sa fade ho jaye
            noBtn.style.zIndex = '-1'; // Peeche chala jaye
        }

        // Desktop par mouse le jaane par bhaagega
        noBtn.addEventListener('mouseover', moveNoButton);
        
        // Mobile par touch/click karne par bhaagega
        noBtn.addEventListener('click', moveNoButton);
        noBtn.addEventListener('touchstart', moveNoButton);

        // Yes button ka logic
        yesBtn.addEventListener('click', function() {
            // 1. Song Play Karein
            song.play().catch(error => {
                console.log("Song play karne me error aayi: ", error);
            });

            // 2. Naam Puchein
            setTimeout(() => {
                let userName = prompt("Shukriya! Kripya apna naam likhein:");
                
                if (userName) {
                    alert("Wow " + userName + "! Chaliye Dandiya shuru karein! 🎉💃🕺");
                }
            }, 500); // 0.5 second ka delay taaki song start ho jaye
        });
    </script>
</body>
</html>
